services:
  flask:
    build:
      context: .
      dockerfile: flask_dockerfile
    volumes:
      - ./logs:/app/logs
      # STEP 2 CHANGE (F-05): encrypted files persist across restarts
      - encrypted_data:/data
      # STEP 3 CHANGE: Unix socket shared with nginx
      - app_socket:/run/app
    # STEP 3 CHANGE (F-07, iteration 2):
    # Iteration 1 put Flask on an `internal: true` network, but retesting showed
    # the host could still reach http://<flask-ip>:5000 directly (Docker internal
    # networks block outbound traffic, not host -> container). So Flask now has
    # NO network interface at all. nginx talks to it over the Unix socket.
    # Side effect: the container cannot make any outbound connection, which
    # would also have blocked the original canarytokens exfiltration.
    network_mode: none

  nginx:
    build:
      context: .
      dockerfile: nginx_dockerfile
    ports:
      - "80:80"     # redirect-only
      - "443:443"   # HTTPS
    volumes:
      # certificate + private key mounted read-only, never baked into the image
      - ./certs:/etc/nginx/certs:ro
      - app_socket:/run/app
    depends_on:
      - flask

volumes:
  encrypted_data:
  app_socket:
