services:
  flask:
    build:
      context: .
      dockerfile: flask_dockerfile
    volumes:
      - ./logs:/app/logs
      # STEP 2 CHANGE (F-05): encrypted files persist across restarts
      - encrypted_data:/data
    expose:
      - "5000"

  nginx:
    build:
      context: .
      dockerfile: nginx_dockerfile
    ports:
      - "443:443"
    depends_on:
      - flask

volumes:
  encrypted_data:
