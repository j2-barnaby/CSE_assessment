# STEP 4 CHANGE: nginx runs as non-root (UID 101) with a read-only root
# filesystem, so the PID file and temporary files live in the /tmp tmpfs.
pid /tmp/nginx.pid;

events { }

http {
    # STEP 3 CHANGE (Web SRG information-leakage / ZAP finding):
    # hide the nginx version number from the Server header and error pages
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # STEP 5 CHANGE (F-14, ASD V-222441-V-222448, V-222470; Web SRG V-206356):
    # structured JSON access log with source AND destination address, TLS
    # version/cipher and a request ID shared with the Flask audit log.
    # escape=json stops log injection via crafted URLs or User-Agents.
    log_format audit_json escape=json
      '{"ts":"$time_iso8601","event":"proxy_request","request_id":"$request_id",'
      '"src_ip":"$remote_addr","dst":"$server_addr:$server_port","host":"$host",'
      '"method":"$request_method","uri":"$request_uri","status":$status,'
      '"bytes":$body_bytes_sent,"duration_s":$request_time,'
      '"tls":"$ssl_protocol","cipher":"$ssl_cipher",'
      '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout audit_json;

    # STEP 6 CHANGE (ASD V-222432 defence in depth): rate-limit sign-in and
    # registration per client IP, so password guessing is throttled at the
    # proxy even before the application's 3-attempt account lockout.
    # Only POST attempts count; simply loading the page is not throttled.
    map $request_method $auth_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $auth_limit_key zone=auth:10m rate=20r/m;
    limit_req_status 429;

    # STEP 2 CHANGE (F-13): match Flask's 10 MB upload limit (nginx default is 1 MB)
    client_max_body_size 10m;

    # -----------------------------------------------------------------------
    # STEP 3 CHANGE (F-07): port 80 exists ONLY to redirect to HTTPS.
    # No application content is ever served over plain HTTP.
    # -----------------------------------------------------------------------
    server {
        listen 8080;    # STEP 4: non-root port; Docker maps host 80 -> 8080
        server_name _;
        return 301 https://$host$request_uri;
    }

    # -----------------------------------------------------------------------
    # STEP 3 CHANGE (F-07): TLS termination
    # Web SRG V-206434, V-206439, V-206440, V-206387; ASD V-222641
    # -----------------------------------------------------------------------
    server {
        listen 8443 ssl;    # STEP 4: non-root port; Docker maps host 443 -> 8443
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        # NIST SP 800-52 Rev 2: TLS 1.2 and 1.3 only (SSLv3, TLS 1.0/1.1 disabled)
        ssl_protocols TLSv1.2 TLSv1.3;

        # TLS 1.2 suites - NIST SP 800-52r2 Section 3.3.1.1:
        # ECDHE key exchange (forward secrecy) + AES-GCM (authenticated encryption).
        # No CBC, no RSA key exchange, no export/NULL/RC4/3DES ciphers.
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;

        # TLS 1.3 suites - NIST SP 800-52r2 Section 3.3.1.2.
        # NOTE: `ssl_ciphers` does NOT control TLS 1.3 in nginx; it needs
        # ssl_conf_command. CHACHA20_POLY1305 (in the supplied example config)
        # is deliberately excluded: it is not on the NIST 800-52r2 list.
        ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;

        ssl_prefer_server_ciphers on;
        # NIST-approved curves only (SP 800-186 / 800-56A)
        ssl_ecdh_curve secp384r1:prime256v1;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # HSTS: browsers remember to use HTTPS only for this site (1 year)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Security headers (fix OWASP ZAP missing-header findings)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # proxy headers apply to every location below
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # STEP 5 CHANGE: overwrite (not append) so clients cannot spoof
        # their source IP in the audit log
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # STEP 5 CHANGE: correlation ID + destination address for Flask
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Server-Addr $server_addr:$server_port;

        location ~ ^/(login|register)$ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://unix:/run/app/app.sock;
        }

        location / {
            # STEP 3 CHANGE: Unix socket instead of TCP - Flask has no network
            proxy_pass http://unix:/run/app/app.sock;
        }
    }
}
