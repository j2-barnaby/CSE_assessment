{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<section class="card card-narrow">
  <h1>{{ status }} - something went wrong</h1>
  <p>{{ message }}</p>
  {% if request_id %}<p class="muted small">Reference: <code>{{ request_id }}</code></p>{% endif %}
  <a class="btn" href="{{ url_for('index') }}">Back to my files</a>
</section>
{% endblock %}
